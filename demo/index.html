<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Filter Plugin — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e8eaed;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    #root {
      width: 100%;
      max-width: 960px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div style="width:100%;max-width:960px">
    <div id="root"></div>
    <pre id="mask" style="margin-top:12px;padding:12px;background:#fff;border-radius:8px;font-size:12px;min-height:40px">Click a day, a week number or a shortcut to see the filter sent to the dashboard.</pre>
  </div>
  <script src="demo-bundle.js"></script>
  <script>
    // ?h=60 shows the compact native filter; ?lang=en switches language
    CalendarFilterDemo.renderDemo('root', Number(new URLSearchParams(location.search).get('h')) || 700, 920);
  </script>
</body>
</html>
